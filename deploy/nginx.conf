# /etc/nginx/sites-available/shix-media-server
# Replace media.example.com with your domain. After placing this file:
#   sudo ln -s /etc/nginx/sites-available/shix-media-server /etc/nginx/sites-enabled/
#   sudo certbot --nginx -d media.example.com   # issues + wires up the cert
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name media.example.com;
    # certbot adds the ACME challenge location; everything else → HTTPS.
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name media.example.com;

    # Managed by certbot (paths created by `certbot --nginx`).
    ssl_certificate     /etc/letsencrypt/live/media.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/media.example.com/privkey.pem;

    # Videos can be large; this only caps request bodies, not responses.
    client_max_body_size 32m;

    # App (pages, tRPC, thumbnails) — buffering on is fine and faster.
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $http_connection;
    }

    # Video streaming: pass Range through untouched and don't buffer the body,
    # so seeking works and big files don't get spooled to disk.
    location /api/stream {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering         off;
        proxy_request_buffering off;
        proxy_read_timeout      1h;
        proxy_send_timeout      1h;
    }
}
